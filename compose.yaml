services:
  silo-monitor:
    image: ghcr.io/safetyp1/silo-monitor:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      SILO_URL: ${SILO_URL:?Set SILO_URL in .env}
      SILO_API_KEY: ${SILO_API_KEY:?Set SILO_API_KEY in .env}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      IFD_URL: ${IFD_URL:-}
      IFD_API_KEY: ${IFD_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      ARR_REPLACEMENTS_ENABLED: ${ARR_REPLACEMENTS_ENABLED:-false}
      REPLACEMENT_DATA_DIR: /data/replacements
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      PUSH_DATA_DIR: /data/push
      ACTIVITY_DATA_DIR: /data/activity
      LISTEN_ADDR: :8080
      GOMAXPROCS: "1"
      GOMEMLIMIT: 32MiB
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-8091}:8080"
    volumes:
      - notification-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 48m
    cpus: 0.10

volumes:
  notification-data:
